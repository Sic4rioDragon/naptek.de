name: Update Twitch data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: naptek-twitch-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update Twitch data
        run: node scripts/twitch/update-twitch.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_USER_REFRESH_TOKEN: ${{ secrets.TWITCH_USER_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TWITCH_BROADCASTER_LOGIN: ${{ secrets.TWITCH_BROADCASTER_LOGIN }}
          PUBLISH_FOLLOWER_NAMES: ${{ vars.PUBLISH_FOLLOWER_NAMES }}
          PUBLISH_FULL_FOLLOWER_LIST: ${{ vars.PUBLISH_FULL_FOLLOWER_LIST }}

      - name: Validate generated data
        run: node scripts/twitch/validate-data.mjs

      - name: Commit changed public data
        shell: bash
        run: |
          if git diff --quiet -- data/twitch; then
            echo "No Twitch data changes."
            exit 0
          fi

          git config user.name "napTek Twitch Data"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/twitch
          git commit -m "chore: update Twitch data"

          # A normal website commit may land while this workflow is running.
          # Rebase the generated-data commit instead of failing the push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
